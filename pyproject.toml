[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-model"
version = "0.1.0a1"
description = "Provider-neutral infrastructure model reference implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.22", "referencing>=0.35", "networkx>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

[project.scripts]
infra-model = "infra_model.cli:main"

[tool.setuptools]
packages = ["infra_model", "infra_model._schemas"]
package-dir = {infra_model = "src/infra_model", "infra_model._schemas" = "schema/v0alpha1"}

[tool.setuptools.package-data]
"infra_model._schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
