apiVersion: infra.model/v0alpha1
kind: Site
metadata:
  name: site-a
spec: {}
---
apiVersion: infra.model/v0alpha1
kind: Site
metadata:
  name: site-b
spec: {}
---
apiVersion: infra.model/v0alpha1
kind: Network
metadata:
  name: fabnet
spec:
  layer: layer3
  addressFamily: ipv4
  addressAllocation: provider-managed
  reachability: provider-internal
  siteRefs:
  - site/site-a
---
apiVersion: infra.model/v0alpha1
kind: Network
metadata:
  name: data-a
spec:
  layer: layer2
  siteRefs:
  - site/site-a
---
apiVersion: infra.model/v0alpha1
kind: Network
metadata:
  name: data-b
spec:
  layer: layer2
  siteRefs:
  - site/site-a
---
apiVersion: infra.model/v0alpha1
kind: Network
metadata:
  name: data-c
spec:
  layer: layer2
  siteRefs:
  - site/site-a
---
apiVersion: infra.model/v0alpha1
kind: Cluster
metadata:
  name: fabric-fpga-two-devices
spec:
  image:
    name: Rocky Linux
    version: '9'
  nodes:
  - name: vm-a
    realization:
      type: vm
    placement:
      siteRef: site/site-a
    requirements:
      compute:
        cpu:
          count: 2
          unit: vcpu
      memory:
        capacity:
          value: 4
          unit: GiB
      storage:
        capacity:
          value: 20
          unit: GiB
      devices:
      - name: secondary
        type: fpga
        constraints:
          vendor: AMD
          model: U280
      - name: primary
        type: fpga
        constraints:
          vendor: AMD
          model: U280
    networkAttachments:
    - name: fabnet
      networkRef: network/fabnet
      deviceRequirementRef: primary
      interfaceRequirements:
        type: ethernet
    - name: data-a
      networkRef: network/data-a
      deviceRequirementRef: secondary
      interfaceRequirements:
        type: ethernet
    - name: data-b
      networkRef: network/data-b
      deviceRequirementRef: primary
      interfaceRequirements:
        type: ethernet
    - name: data-c
      networkRef: network/data-c
      deviceRequirementRef: secondary
      interfaceRequirements:
        type: ethernet
