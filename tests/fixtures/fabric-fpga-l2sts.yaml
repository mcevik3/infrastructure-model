apiVersion: infra.model/v0alpha1
kind: Site
metadata:
  name: site-a
spec: {}
---
apiVersion: infra.model/v0alpha1
kind: Site
metadata:
  name: site-b
spec: {}
---
apiVersion: infra.model/v0alpha1
kind: Network
metadata:
  name: data
spec:
  layer: layer2
  siteRefs:
  - site/site-a
  - site/site-b
---
apiVersion: infra.model/v0alpha1
kind: Cluster
metadata:
  name: fabric-fpga-l2sts
spec:
  image:
    name: Rocky Linux
    version: '9'
  nodes:
  - name: vm-a
    realization:
      type: vm
    placement:
      siteRef: site/site-a
    requirements:
      compute:
        cpu:
          count: 2
          unit: vcpu
      memory:
        capacity:
          value: 4
          unit: GiB
      storage:
        capacity:
          value: 20
          unit: GiB
      devices:
      - name: primary
        type: fpga
        constraints:
          vendor: Xilinx
          model: SN1022
    networkAttachments:
    - name: data
      networkRef: network/data
      deviceRequirementRef: primary
      interfaceRequirements:
        type: ethernet
  - name: peer
    realization:
      type: vm
    placement:
      siteRef: site/site-b
    requirements:
      compute:
        cpu:
          count: 2
          unit: vcpu
      memory:
        capacity:
          value: 4
          unit: GiB
      storage:
        capacity:
          value: 20
          unit: GiB
      devices: []
    networkAttachments:
    - name: data
      networkRef: network/data
      interfaceRequirements:
        type: ethernet
