apiVersion: infra.model/v0alpha1
kind: Site
metadata:
  name: lab-site
spec: {}
---
apiVersion: infra.model/v0alpha1
kind: Network
metadata:
  name: management
spec:
  layer: layer2
  connectivity: multipoint
  siteRefs:
    - site/lab-site
---
apiVersion: infra.model/v0alpha1
kind: Cluster
metadata:
  name: fabric-dpu-allocation
spec:
  siteRef: site/lab-site
  image:
    name: Rocky Linux
    version: "9"

  nodes:
    - name: dpu-node
      realization:
        type: vm

      requirements:
        compute:
          architecture: x86_64
          cpu:
            count: 4
            unit: vcpu

        memory:
          capacity:
            value: 16
            unit: GiB

        storage:
          capacity:
            value: 20
            unit: GiB

        devices:
          - name: dpu
            type: dpu
            constraints:
              vendor: NVIDIA
              model: ConnectX-7-100

      networkAttachments:
        - name: management
          networkRef: network/management
          interfaceRequirements:
            type: ethernet
